<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>사전</title>
    <meta name="theme-color" content="#161716" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <form id="search-form" role="search">
        <a class="home-link" href="../home/" aria-label="Home page (all sites)" title="Home page (all sites)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-5.5h3V20h5V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="#" id="home" aria-label="Home" lang="ko">사전</a>
        <button id="version" type="button" class="version" data-state="checking" aria-label="Checking for updates…" title="Checking for updates…"><i></i><span></span></button>
        <input
          id="q"
          type="search"
          placeholder="Search (English / Korean)"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Search"
        />
        <button id="settings-btn" type="button" class="icon-btn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      </form>
    </header>

    <dialog id="settings" aria-labelledby="settings-title">
      <form method="dialog">
        <h2 id="settings-title">Settings</h2>
        <label class="setting">
          <input type="checkbox" id="set-korean-only" />
          <span>
            <b>Show Korean-only dictionaries</b>
            <small>Adds Urimalsaem (우리말샘), which explains words in Korean for native speakers, to entry pages and search results. When off, you only see words from the Basic Korean Dictionary (한국어기초사전), which has English.</small>
          </span>
        </label>
        <button class="btn">Done</button>
      </form>
    </dialog>

    <main>
      <details id="credit" hidden>
        <summary>Data attribution</summary>
        <p>
          National Institute of Korean Language —
          <a href="https://opendict.korean.go.kr/" rel="noopener">Urimalsaem (우리말샘)</a> and
          <a href="https://krdict.korean.go.kr/" rel="noopener">Basic Korean Dictionary (한국어기초사전)</a>,
          <a href="https://creativecommons.org/licenses/by-sa/2.0/kr/" rel="noopener">CC BY-SA 2.0 KR</a>.
          Examples quoted from publications and multimedia are excluded.
          Hanja readings and meanings from the
          <a href="https://www.unicode.org/charts/unihan.html" rel="noopener">Unicode Unihan database</a>
          (<a href="https://www.unicode.org/license.txt" rel="noopener">Unicode License</a>).
        </p>
      </details>
      <section id="results" aria-live="polite"></section>
      <article id="entry" hidden></article>
      <p id="status" hidden></p>
    </main>


    <script src="version.js"></script>
    <script src="deinflect.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
