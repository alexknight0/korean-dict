<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>사전</title>
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161716" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <form id="search-form" role="search">
        <a href="#" id="home" aria-label="Home" lang="ko">사전</a>
        <input
          id="q"
          type="search"
          placeholder="Search · 먹었는데 · doctor"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Search"
        />
      </form>
    </header>

    <main>
      <section id="results" aria-live="polite"></section>
      <article id="entry" hidden></article>
      <p id="status" hidden></p>
    </main>


    <script src="deinflect.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
