<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>사전</title>
    <meta name="theme-color" content="#161716" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <form id="search-form" role="search">
        <a href="#" id="home" aria-label="Home" lang="ko">사전</a>
        <input
          id="q"
          type="search"
          placeholder="Search · 먹었는데 · doctor"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Search"
        />
      </form>
    </header>

    <main>
      <details id="credit" hidden>
        <summary>Data attribution</summary>
        <p>
          National Institute of Korean Language —
          <a href="https://opendict.korean.go.kr/" rel="noopener">Urimalsaem (우리말샘)</a> and
          <a href="https://krdict.korean.go.kr/" rel="noopener">Basic Korean Dictionary (한국어기초사전)</a>,
          <a href="https://creativecommons.org/licenses/by-sa/2.0/kr/" rel="noopener">CC BY-SA 2.0 KR</a>.
          Examples quoted from publications and multimedia are excluded.
        </p>
      </details>
      <section id="results" aria-live="polite"></section>
      <article id="entry" hidden></article>
      <p id="status" hidden></p>
    </main>


    <script src="deinflect.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
